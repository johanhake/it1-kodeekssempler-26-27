<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <title>Bildegalleri</title>
  <style>

    body{
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    header h1{
      font-size: 10vw;
      text-align: center;
    }

    header nav {
      display: flex;
      width: 100%;
    }

    header nav a {
      padding: 10px;
      border: 1px solid black;
      flex-basis: 150px;
      flex-shrink: 1;
    }

    header nav div {
      flex-grow: 1;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    main a img {
      width: 100%;
      transition: 0.5s;
    }

    main a img:hover{
      filter: sepia(75%);
    }

    .to-kolonner {
      grid-column: span 2;
    }

    .tre-kolonner {
      grid-column: span 3;
    }

    .fjern-tre-kolonner {
      display: none;
    }

    @media screen and (max-width: 960px) {
      main {
        grid-template-columns: 1fr 1fr;
      }

      .fjern-to-kolonner {
        display: none;
      }

      .fjern-tre-kolonner {
        display: inline;
      }

    }
  </style>
</head>

<body>
  <header>
    <h1>Tregalleri</h1>
    <nav>
      <a href="">Lenke 1</a>
      <a href="">Lenke 2</a>
      <a href="">Lenke 3</a>
      <a href="">Lenke 4</a>
      <div></div>
      <a href="">Hjem</a>
    </nav>
  </header>
  <main>
    <a href="#" class="tre-kolonner fjern-to-kolonner"><img src="bilder/tre-lang-rektangel-1.jpg"></a>
    <a href="#" class="to-kolonner fjern-tre-kolonner"><img src="bilder/tre-rektangel-1.jpg"></a>
    <a href="#"><img src="bilder/tre-kvadrat-1.jpg"></a>
    <a href="#"><img src="bilder/tre-kvadrat-2.jpg"></a>
    <a href="#"><img src="bilder/tre-kvadrat-3.jpg"></a>
    <a href="#"><img src="bilder/tre-kvadrat-4.jpg"></a>
    <a href="#" class="to-kolonner" ><img src="bilder/tre-rektangel-2.jpg"></a>
    <a href="#" class="to-kolonner"><img src="bilder/tre-rektangel-3.jpg"></a>
    <a href="#" class="fjern-to-kolonner"><img src="bilder/tre-kvadrat-5.jpg"></a>
  </main>
</body>

</html>
