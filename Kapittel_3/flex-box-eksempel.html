<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block--grey {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            width: 1000px;
            height: 800px;
            gap: 5%;
            background-color: grey;
        }

        .block--red {
            width: 20%;
            height: 20%;
            background-color: red;
        }

        .block--red h1 {}

        .block--inline {
            /* display: inline; */
            background-color: black;
        }

        .block--green {
            display: flex;
            justify-content: center;
            width: 12.5rem;
            height: 12.5rem;
            background-color: green;
        }

        .block--green ul {
            /* display: grid; */
            /* grid-template-columns: repeat(2, 1fr); */
        }

        ul li {}

        .block--blue {
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-around;
            align-items: center;
            width: 200px;
            height: 200px;
            background-color: blue;
        }

        .block--blue p {}

        .block--blue img {
            width: 50%;
            height: 50%;
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="block--grey">
        <div class="block--red">
            <h1>header</h1>
            <div class="block--inline">
            </div>
        </div>

        <div class="block--green">
            <ul>
                <li>text</li>
                <li>text</li>
                <li>text</li>
                <li>text</li>
                <li>text</li>
                <li>text</li>
            </ul>
        </div>

        <div class="block--blue">
            <p>description</p>
            <img src="" alt="">
        </div>
    </div>
</body>

</html>
