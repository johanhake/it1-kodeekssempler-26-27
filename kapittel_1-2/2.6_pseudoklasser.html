<!DOCTYPE html>
<html lang="no">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Forfatter</title>
	<style>
		html {
			font-size: 50px;

		}

		input {
			height: 1.5rem;
			font-size: 1rem;
		}

		/* Eksempel med focus box-shadow: inset 0 2px 5px red;*/
		input[type=text]:active{
			background-color: aliceblue;
		}

		input[type=text]:focus{
			background-color: antiquewhite;
			box-shadow: inset 2px 2px 5px red, inset -2px -2px 5px red;
		}

		/* Virker ikke for at vi ikke kan style selve checkboxen*/
		input[type=checkbox]:checked {
			border: 1px solid red;
		}

		/* Eksempel med hover, active*/
		img {
			border: white 10px solid;
		}


		/* Eksempel med nth-child()*/
		li:nth-child(odd) {
			background-color: aquamarine;
		}

		a{
			transition: 0.25s;
		}

		a:hover {
			cursor: crosshair;
			background-color: red;
			color: white
		}
	</style>
</head>

<body>
	<label for="">Skriv ditt navn: </label>
	<input type="text">
	<label for="velg">Velg da!</label>
	<input id="velg" type="checkbox">
	<img src="bilder/MrNilsson.jpg">
	<p>
		<a href="http://cappelendamm.no">Astrid Lindgren</a>
	</p>
	<ul>
		<li>Vi på Saltkråkan</li>
		<li>Pippi Langstrømpe</li>
		<li>Ronja Røverdatter</li>
		<li>Emil i Lønneberget</li>
		<li>Mio, min Mio</li>
	</ul>
</body>

</html>
