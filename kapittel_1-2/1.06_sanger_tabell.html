<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabell med låter</title>
    <style>
        table{
            border: 2px black solid;
            border-collapse: collapse;
        }
        td, th{
            border: 2px black solid;
            padding: 5px;
            width: 150px;
        }
    </style>    
</head>
<body>
    <table>
        <thead>
            <tr><th>År</th><th>Låt</th><th>Artist</th></tr>
        </thead>
        <tbody>
            <tr><td>2019</td><td>Spirit in the Sky</td><td>KEiiNO</td></tr>
            <tr><td>2020</td><td>Attention</td><td>Ulrikke Brandstorp</td></tr>
            <tr><td>2021</td><td>Fallen Angel</td><td>Tix</td></tr>
        </tbody>
    </table>
</body>
</html>
