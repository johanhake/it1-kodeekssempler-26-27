<!DOCTYPE html>
<html lang="en">

<head>
	<title>Kjente byer</title>
	<style>
		*{
			/* Nullstiller padding og margin*/
			margin:0;
			padding: 0;
			box-sizing: border-box;
		}

		.rundt-bilde{
			width:300px;
			height: 300px;
			object-fit: cover;
			border-radius: 50%;
			border: solid 20px orange
		}

		#hoved-bilde{
			width: 400px;
			height: 400px;
		}

	</style>
</head>

<body>
	<h1>Kjente byer</h1>
	<img class="rundt-bilde" id="hoved-bilde" src="bilder/Pisa.jpg">
	<img class="rundt-bilde" src="bilder/Moskva.jpg" >
	<img class="rundt-bilde" src="bilder/TelAviv.jpg">
	<img class="rundt-bilde større-kantlinje" src="bilder/Paris.jpg" ><br>
	<!-- Finn selv ut hvordan man kan style input elementer! -->
	<input type="text">
	<input type="number">
</body>

</html>
