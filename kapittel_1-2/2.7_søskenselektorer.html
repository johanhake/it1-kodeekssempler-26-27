<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		* {
			font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
		}

		/* h1 + p, h2 ~p*/
		#første h1~p {
			background-color: aqua;
		}

		#andre h1+p {
			background-color: blueviolet;
			color: white;
		}
	</style>
</head>

<body>
	<div id="første">
		<p>Nullte avsnitt</p>
		<h1>Kombinere med ~</h1>
		<p>Første avsnitt</p>
		<li>En liten luring</li>
		<p>Andre avsnitt</p>
		<p>Tredje avsnitt</p>
	</div>
	<div id="andre">
		<h1>Kombinere med +</h1>
		<p>Første avsnitt</p>
		<p>Andre avsnitt</p>
		<p>Tredje avsnitt</p>
	</div>
</body>

</html>
