<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		body{
			font-family: Verdana, Geneva, Tahoma, sans-serif;
		}
		
		input[type=text], input[type=number], select{
			width: 200px;
		}

		label{
			display: inline-block;
			width: 100px;
		}
	</style>
</head>

<body>
	<h2>Skjema for registrering klassefest!</h2>
	<form action="1.09_registrering.html">
		<input type="text" name="fornavn"placeholder="Hva heter du">
		<br>
		<input type="number" placeholder="Hvor gammel er du?">
		<br>
		<select>
			<option>Hamburger</option>
			<option>Pizza</option>
			<option>Taco</option>
		</select>
		<br>
		<h3>Hva ønsker du å drikke til maten?</h3>
		<input type="radio"><label>Brus</label>
		<input type="radio"><label>Saft</label>
		<input type="radio"><label>Vann</label>
		<br>
		<input type="checkbox"><label>Ketsjup</label>
		<input type="checkbox"><label>Sennep</label>
		<br>
		<button>Send inn</button>
	</form>
</body>

</html>
